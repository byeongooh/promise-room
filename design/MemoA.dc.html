<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system,
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: rgb(247, 247, 248);
      color: rgb(23, 23, 23);
      -webkit-font-smoothing: antialiased;
    }
    a { color: rgb(178, 50, 42); }
    a:hover { color: rgb(140, 38, 32); }
    .lbl { font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.06em; }
    .meta { font-size: 13px; line-height: 1.5; font-weight: 400; }
    .cap { font-size: 12px; line-height: 1.4; font-weight: 400; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.05); }
  </style>
</helmet>

<div style="width: 390px; padding: 20px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
    <span class="lbl" style="color: rgb(178,50,42)">A안 · 한 줄로 끝</span>
    <span class="cap" style="color: rgba(55,56,60,0.61); line-height: 1.5">치고 엔터. 가장 익숙하고 무엇이든 쓸 수 있다.</span>
  </div>

  <div class="card" style="padding: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px">
      <span class="meta" style="font-weight: 700">8월 24일 (월)</span>
      <span class="cap" style="color: rgba(55,56,60,0.28)">메모 1</span>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; padding: 11px 12px; background: rgb(247,247,248); border-radius: 12px; margin-bottom: 6px">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: rgba(55,56,60,0.28); flex-shrink: 0"></span>
      <span class="meta" style="color: rgba(46,47,51,0.88); flex-grow: 1">가는 길에 선물 사기</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.28)" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; background: #fff; border: 1px solid rgb(23,23,23); border-radius: 12px">
      <span style="width: 5px; height: 5px; border-radius: 50%; background: rgba(55,56,60,0.28); flex-shrink: 0"></span>
      <span class="meta" style="color: rgba(55,56,60,0.28); flex-grow: 1">숙소 예약 확인</span>
      <span style="width: 1.5px; height: 17px; background: rgb(23,23,23)"></span>
      <button style="height: 30px; padding: 0 12px; border: 0; background: rgb(23,23,23); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0">저장</button>
    </div>

    <p class="cap" style="margin: 10px 2px 0; color: rgba(55,56,60,0.28)">엔터를 눌러도 저장돼요</p>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 2px">
    <span style="width: 3px; border-radius: 2px; background: rgba(74,128,88,0.35); flex-shrink: 0"></span>
    <span class="cap" style="color: rgba(46,47,51,0.88); line-height: 1.6">무엇이든 쓸 수 있고 배울 게 없다.<br>대신 <b style="font-weight: 700">매번 처음부터 타이핑</b>해야 한다.</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
