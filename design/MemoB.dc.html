<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system,
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: rgb(247, 247, 248);
      color: rgb(23, 23, 23);
      -webkit-font-smoothing: antialiased;
    }
    a { color: rgb(178, 50, 42); }
    a:hover { color: rgb(140, 38, 32); }
    .lbl { font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.06em; }
    .meta { font-size: 13px; line-height: 1.5; font-weight: 400; }
    .cap { font-size: 12px; line-height: 1.4; font-weight: 400; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.05); }
  </style>
</helmet>

<div style="width: 390px; padding: 20px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
    <span class="lbl" style="color: rgb(178,50,42)">B안 · 눌러서 붙이기</span>
    <span class="cap" style="color: rgba(55,56,60,0.61); line-height: 1.5">자주 적는 것은 이미 칩으로 있다. 한 번 누르면 끝.</span>
  </div>

  <div class="card" style="padding: 14px">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px">
      <span class="meta" style="font-weight: 700">8월 24일 (월)</span>
      <span class="cap" style="color: rgba(55,56,60,0.28)">눌러서 담기</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" style="{{c.style}}">
          <sc-if value="{{c.on}}" hint-placeholder-val="{{ true }}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 6L9 17l-5-5"/></svg>
          </sc-if>
          {{c.text}}
        </button>
      </sc-for>
    </div>

    <div style="height: 1px; background: rgba(112,115,124,0.22); margin-bottom: 12px"></div>

    <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: rgb(247,247,248); border-radius: 12px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.28)" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0"><path d="M12 5v14M5 12h14"/></svg>
      <span class="meta" style="color: rgba(55,56,60,0.28); flex-grow: 1">직접 쓰기</span>
    </div>

    <p class="cap" style="margin: 10px 2px 0; color: rgba(55,56,60,0.28)">자주 쓴 것이 위로 올라와요</p>
  </div>

  <div style="display: flex; gap: 8px; padding: 0 2px">
    <span style="width: 3px; border-radius: 2px; background: rgba(74,128,88,0.35); flex-shrink: 0"></span>
    <span class="cap" style="color: rgba(46,47,51,0.88); line-height: 1.6"><b style="font-weight: 700">한 번 누르면 끝</b>이라 귀찮음이 거의 없다.<br>대신 칩에 없는 것은 결국 타이핑이다.</span>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: { 0: true } };
  }
  renderVals() {
    const labels = ['선물 사기', '현금 뽑기', '숙소 예약 확인', '충전기 챙기기', '차 기름', '약 챙기기'];
    const on = 'display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:0;border-radius:17px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;background:rgb(23,23,23);color:#fff;';
    const off = 'display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border:0;border-radius:17px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:400;background:rgb(244,244,245);color:rgba(46,47,51,0.88);';
    return {
      chips: labels.map((text, i) => ({
        text,
        on: !!this.state.picked[i],
        style: this.state.picked[i] ? on : off,
        pick: () => {
          const next = { ...this.state.picked };
          if (next[i]) delete next[i]; else next[i] = true;
          this.setState({ picked: next });
        },
      })),
    };
  }
}
</script>
</body>
</html>
