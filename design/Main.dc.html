<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body {
      margin: 0;
      font-family: "Pretendard Variable", "Pretendard", system-ui, -apple-system,
        "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: rgb(247, 247, 248);
      color: rgb(23, 23, 23);
      -webkit-font-smoothing: antialiased;
    }
    a { color: rgb(178, 50, 42); }
    a:hover { color: rgb(140, 38, 32); }
    .lbl { font-size: 11px; line-height: 1.3; font-weight: 700; letter-spacing: 0.06em; }
    .ttl { font-size: 16px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; word-break: keep-all; }
    .meta { font-size: 13px; line-height: 1.5; font-weight: 400; font-variant-numeric: tabular-nums; }
    .cap { font-size: 12px; line-height: 1.4; font-weight: 400; }
    .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 2px 0 rgba(0,0,0,.05), 0 0 0 1px rgba(0,0,0,.05); }
  </style>
</helmet>

<div style="width: 390px; padding: 20px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px 14px">
    <div style="display: flex; align-items: baseline; gap: 8px">
      <span style="font-size: 20px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em">2026년 8월</span>
    </div>
    <div style="display: flex; align-items: center; gap: 4px">
      <button style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.61)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button style="height: 32px; padding: 0 12px; border: 0; background: rgb(244,244,245); border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 700; color: rgba(46,47,51,0.88)">오늘</button>
      <button style="width: 32px; height: 32px; border: 0; background: transparent; border-radius: 8px; cursor: pointer; display: grid; place-items: center; padding: 0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.61)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding-bottom: 6px">
    <div class="cap" style="text-align: center; color: rgba(178,50,42,0.55)">일</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">월</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">화</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">수</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">목</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">금</div>
    <div class="cap" style="text-align: center; color: rgba(55,56,60,0.61)">토</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">

    <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
      <div style="{{c.cellStyle}}">
        <span style="{{c.numStyle}}">{{c.n}}</span>
        <span style="display: flex; gap: 3px; align-items: center; height: 8px">
          <sc-if value="{{c.plan}}" hint-placeholder-val="{{ true }}">
            <svg width="9" height="10" viewBox="0 0 100 112" aria-hidden="true">
              <path d="M50 37C43 26 28 23 19 33C9 44 11 67 22 83C26 93 37 101 50 101C63 101 74 93 78 83C89 67 91 44 81 33C72 23 57 26 50 37Z" fill="{{c.planFill}}"/>
              <path d="M50 37C50 29 51 22 54 16" fill="none" stroke="{{c.stemFill}}" stroke-width="12" stroke-linecap="round"/>
            </svg>
          </sc-if>
          <sc-if value="{{c.memo}}" hint-placeholder-val="{{ true }}">
            <span style="{{c.memoStyle}}"></span>
          </sc-if>
        </span>
      </div>
    </sc-for>

  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 20px 4px 8px">
    <span class="meta" style="font-weight: 700; color: rgb(23,23,23)">8월 24일 (월)</span>
    <span class="cap" style="color: rgba(55,56,60,0.61)">D-3</span>
  </div>

  <div class="card" style="padding: 14px; margin-bottom: 6px">
    <div style="display: flex; gap: 10px; align-items: flex-start">
      <svg width="20" height="22" viewBox="0 0 100 112" style="flex-shrink: 0; margin-top: 1px" aria-hidden="true">
        <path d="M50 37C43 26 28 23 19 33C9 44 11 67 22 83C26 93 37 101 50 101C63 101 74 93 78 83C89 67 91 44 81 33C72 23 57 26 50 37Z" fill="rgb(178,50,42)"/>
        <path d="M50 37C50 29 51 22 54 16" fill="none" stroke="rgb(74,128,88)" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
        <span class="ttl">다음주 어디서 보징</span>
        <span class="meta" style="color: rgba(55,56,60,0.61)">오후 9:00 · 해운대해수욕장 · 2명</span>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.28)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 4px"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="margin-top: 12px; padding: 11px 12px; background: rgba(178,50,42,0.10); border-radius: 10px; display: flex; flex-direction: column; gap: 7px">
      <div style="display: flex; align-items: center; gap: 7px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgb(178,50,42)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span style="font-size: 14px; font-weight: 700; color: rgb(178,50,42); letter-spacing: -0.01em">오후 4:15에 나가야 해요</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <span style="width: 5px; height: 5px; border-radius: 50%; background: rgb(178,50,42); flex-shrink: 0"></span>
        <span style="flex-grow: 1; height: 2px; background: rgba(178,50,42,0.28); border-radius: 1px"></span>
        <span class="cap" style="color: rgb(178,50,42); white-space: nowrap">자동차 4시간 44분</span>
        <span style="flex-grow: 1; height: 2px; background: rgba(178,50,42,0.28); border-radius: 1px"></span>
        <span style="width: 5px; height: 5px; border-radius: 50%; background: rgb(178,50,42); flex-shrink: 0"></span>
      </div>
    </div>
  </div>

  <div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px">
    <span style="width: 5px; height: 5px; border-radius: 50%; background: rgba(55,56,60,0.28); flex-shrink: 0"></span>
    <span class="meta" style="color: rgba(46,47,51,0.88); flex-grow: 1">가는 길에 선물 사기</span>
  </div>

  <button style="height: 44px; border: 1px dashed rgba(112,115,124,0.22); background: transparent; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 400; color: rgba(55,56,60,0.61); display: flex; align-items: center; justify-content: center; gap: 6px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(55,56,60,0.61)" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    이 날에 메모 남기기
  </button>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const base = {
      cellStyle: 'height:46px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;',
      numStyle: 'font-size:13px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums;color:rgb(23,23,23);',
      memoStyle: 'width:4px;height:4px;border-radius:50%;background:rgba(55,56,60,0.28);',
      planFill: 'rgb(178,50,42)',
      stemFill: 'rgb(74,128,88)',
      plan: false,
      memo: false,
    };

    // 8월 1일이 토요일. 앞의 빈 칸 6개.
    const cells = [];
    for (let i = 0; i < 6; i++) cells.push({ ...base, n: '', numStyle: base.numStyle });

    // 지난 날은 흐리게 — 달력을 넘기면 "얼마나 지켰나"가 그대로 보인다.
    const past = 'font-size:13px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums;color:rgba(55,56,60,0.28);';
    const sun = 'font-size:13px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums;color:rgba(178,50,42,0.55);';
    const sunPast = 'font-size:13px;line-height:1;font-weight:400;font-variant-numeric:tabular-nums;color:rgba(178,50,42,0.28);';

    for (let d = 1; d <= 31; d++) {
      const dow = (d + 5) % 7; // 1일 = 토(6)
      const isSun = dow === 0;
      const isPast = d < 21;
      const c = { ...base, n: String(d) };
      c.numStyle = isSun ? (isPast ? sunPast : sun) : (isPast ? past : base.numStyle);

      if (d === 13) { c.plan = true; c.planFill = 'rgba(178,50,42,0.45)'; c.stemFill = 'rgba(74,128,88,0.45)'; }
      if (d === 6)  { c.plan = true; c.planFill = 'rgba(124,116,140,0.55)'; c.stemFill = 'rgba(124,116,140,0.55)'; }
      if (d === 5)  { c.memo = true; }
      if (d === 24) { c.plan = true; c.memo = true; }
      if (d === 29) { c.plan = true; }

      if (d === 21) {
        c.cellStyle = base.cellStyle + 'box-shadow:inset 0 0 0 1px rgba(112,115,124,0.22);';
        c.memo = true;
      }
      if (d === 24) {
        c.cellStyle = base.cellStyle + 'background:rgb(23,23,23);';
        c.numStyle = 'font-size:13px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;';
        c.planFill = 'rgb(238,124,110)';
        c.stemFill = 'rgb(126,182,140)';
        c.memoStyle = 'width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.55);';
      }
      cells.push(c);
    }
    return { cells };
  }
}
</script>
</body>
</html>
